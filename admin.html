<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceHub — Админ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="settings-page">
    <header>
      <div class="logo">VoiceHub</div>
      <div class="header-actions">
        <a href="index.html" class="icon-btn" title="На главную">🏠</a>
      </div>
    </header>
    <div class="settings-container">
      <h1>Админ-панель</h1>

      <div class="settings-section">
        <h2>🗑️ Очистка базы данных</h2>
        <p class="settings-desc">Удалит всех пользователей из Supabase и локального хранилища</p>
        <button class="logout-btn" id="clear-db-btn" style="background:#fef2f2;border-color:#fecaca;color:#ef4444;">Очистить всех пользователей</button>
        <p id="clear-result" style="margin-top:12px;font-size:13px;"></p>
      </div>

      <div class="settings-section">
        <h2>🧹 Очистка локальных данных</h2>
        <p class="settings-desc">Очистить кэш браузера (настройки, статистика)</p>
        <button class="logout-btn" id="clear-local-btn" style="background:#fef2f2;border-color:#fecaca;color:#ef4444;">Очистить localStorage</button>
      </div>
    </div>
  </div>

  <div id="notification"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = 'https://zerqyfvvafzfnglzszlr.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplcnF5ZnZ2YWZ6Zm5nbHpzemxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NTQzMTAsImV4cCI6MjEwMTAzMDMxMH0.KXNjeThlDdGSAUhxhfNwsdY0VwAUCBImMjmXRc8X0ik';

    function notify(msg, type) {
      var el = document.getElementById('notification');
      el.textContent = msg;
      el.className = 'notification ' + (type || 'info');
      el.style.display = 'block';
      clearTimeout(el._t);
      el._t = setTimeout(function() { el.style.display = 'none'; }, 3000);
    }

    document.getElementById('clear-db-btn').addEventListener('click', function() {
      var resultEl = document.getElementById('clear-result');
      resultEl.textContent = 'Удаление...';
      resultEl.style.color = '#6b7280';

      var supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      supa.from('users').delete().neq('user_id', '__none__').then(function(r) {
        if (r.error) {
          resultEl.textContent = 'Ошибка: ' + r.error.message;
          resultEl.style.color = '#ef4444';
          notify('Ошибка: ' + r.error.message, 'error');
        } else {
          resultEl.textContent = 'Все пользователи удалены!';
          resultEl.style.color = '#22c55e';
          notify('БД очищена', 'success');
        }
      }).catch(function(e) {
        resultEl.textContent = 'Ошибка сети: ' + e.message;
        resultEl.style.color = '#ef4444';
      });
    });

    document.getElementById('clear-local-btn').addEventListener('click', function() {
      localStorage.clear();
      notify('localStorage очищен', 'success');
    });
  </script>
</body>
</html>
